<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tor2dbear — workshop</title>
    <meta
      name="description"
      content="The workshop domain for Torbjörn Hedberg — where the projects actually run. Portfolio lives at tor-bjorn.com."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BB%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="masthead">
        <p class="eyebrow">tor2dbear.com</p>
        <h1>The workshop.</h1>
        <p class="lede">
          This is where the things actually run. The polished story lives on the
          <a href="https://www.tor-bjorn.com">portfolio</a>; here you can press
          the keys yourself. Each project has its own subdomain.
        </p>
      </header>

      <section aria-label="Projects">
        <ul class="grid" id="projects"></ul>
      </section>

      <footer class="footer">
        <nav>
          <a href="https://www.tor-bjorn.com">Portfolio ↗</a>
          <a href="https://github.com/tor2dbear">GitHub ↗</a>
          <a href="mailto:hi@tor-bjorn.com">hi@tor-bjorn.com</a>
        </nav>
        <p class="colophon">Torbjörn Hedberg · multidisciplinary designer</p>
      </footer>
    </main>

    <script>
      // No build step: the front page reads projects.json at runtime so the list
      // has one source of truth (also consumed by the new-project script).
      //
      // The card is one big link to the project, with a second link to the repo
      // in its foot. Nested anchors are illegal, so card__main is a sibling that
      // covers the card through a stretched ::after, and the foot sits above it.
      fetch("projects.json")
        .then((r) => r.json())
        .then((data) => {
          const list = document.getElementById("projects");
          for (const p of data.projects) {
            const li = document.createElement("li");
            li.className = "card";
            li.innerHTML = `
              <a class="card__main" href="${p.url}">
                <h2 class="card__name">${p.name}</h2>
                <p class="card__blurb">${p.blurb}</p>
              </a>
              <div class="card__foot">
                <p class="card__stack">${p.stack}</p>
                <a class="card__repo" href="${p.repo}" aria-label="${p.name} source on GitHub">source ↗</a>
              </div>`;
            list.appendChild(li);
          }
        })
        .catch(() => {
          document.getElementById("projects").innerHTML =
            '<li class="card card--empty">Projects list unavailable.</li>';
        });
    </script>
  </body>
</html>
